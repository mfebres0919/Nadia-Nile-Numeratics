<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Projectile arc with force vectors and a gear">
  <defs>
    <linearGradient id="bgphysics" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2143"/><stop offset="1" stop-color="#071429"/>
    </linearGradient>
    <!-- userSpaceOnUse is required, not stylistic: an objectBoundingBox
         gradient cannot resolve against a zero-width bbox, so every straight
         axis line and bar below would silently fail to paint. -->
    <linearGradient id="goldphysics" gradientUnits="userSpaceOnUse" x1="120" y1="120" x2="680" y2="680">
      <stop offset="0" stop-color="#e6c87f"/><stop offset="1" stop-color="#b98c2e"/>
    </linearGradient>
    <pattern id="gridphysics" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowphysics" cx=".5" cy=".45" r=".62">
      <stop offset="0" stop-color="#c69a3e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c69a3e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgphysics)"/>
  <rect width="800" height="800" fill="url(#gridphysics)"/>
  <rect width="800" height="800" fill="url(#glowphysics)"/>
  <g fill="none" stroke="url(#goldphysics)" stroke-linecap="round" stroke-linejoin="round">

    <path d="M110 620 H690" stroke-width="4" stroke-opacity=".6"/>
    <path d="M150 620 C 265 300 435 300 550 620" stroke-width="7" stroke-dasharray="18 13"/>
    <path d="M150 620 L 258 458" stroke-width="6"/>
    <path d="M258 458 l -6 -37 l 34 20 Z" fill="url(#goldphysics)" stroke="none"/>
    <path d="M350 330 V235" stroke-width="5"/>
    <path d="M350 235 l -15 27 h30 Z" fill="url(#goldphysics)" stroke="none"/>
    <path d="M350 330 V425" stroke-width="5"/>
    <path d="M350 425 l -15 -27 h30 Z" fill="url(#goldphysics)" stroke="none"/>
    <circle cx="350" cy="330" r="12" stroke-width="4.5"/>
    <g transform="translate(575 210)">
      <circle r="72" stroke-width="6.5"/>
      <circle r="28" stroke-width="5.5" stroke-opacity=".7"/>
      <g stroke-width="17" stroke-opacity=".9">
        <path d="M0 -72 V-96"/><path d="M0 72 V96"/>
        <path d="M-72 0 H-96"/><path d="M72 0 H96"/>
        <path d="M-51 -51 L-68 -68"/><path d="M51 51 L68 68"/>
        <path d="M51 -51 L68 -68"/><path d="M-51 51 L-68 68"/>
      </g>
    </g>
  </g>
</svg>
