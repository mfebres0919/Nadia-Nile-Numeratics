<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Unit circle unrolling into a sine wave">
  <defs>
    <linearGradient id="bgprecalculus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2143"/><stop offset="1" stop-color="#071429"/>
    </linearGradient>
    <!-- userSpaceOnUse is required, not stylistic: an objectBoundingBox
         gradient cannot resolve against a zero-width bbox, so every straight
         axis line and bar below would silently fail to paint. -->
    <linearGradient id="goldprecalculus" gradientUnits="userSpaceOnUse" x1="120" y1="120" x2="680" y2="680">
      <stop offset="0" stop-color="#e6c87f"/><stop offset="1" stop-color="#b98c2e"/>
    </linearGradient>
    <pattern id="gridprecalculus" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowprecalculus" cx=".5" cy=".45" r=".62">
      <stop offset="0" stop-color="#c69a3e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c69a3e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgprecalculus)"/>
  <rect width="800" height="800" fill="url(#gridprecalculus)"/>
  <rect width="800" height="800" fill="url(#glowprecalculus)"/>
  <g fill="none" stroke="url(#goldprecalculus)" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="270" cy="400" r="165" stroke-width="6"/>
    <path d="M105 400 H435" stroke-width="3" stroke-opacity=".45"/>
    <path d="M270 235 V565" stroke-width="3" stroke-opacity=".45"/>
    <path d="M270 400 L 387 283" stroke-width="7"/>
    <path d="M387 283 V400" stroke-width="3.5" stroke-dasharray="9 10" stroke-opacity=".75"/>
    <path d="M325 400 A 55 55 0 0 0 309 361" stroke-width="4.5"/>
    <circle cx="387" cy="283" r="13" fill="url(#goldprecalculus)" stroke="none"/>
    <path d="M435 400 H470" stroke-width="3" stroke-opacity=".45"/>
    <path d="M470 400 C 508 283 546 283 584 400 C 622 517 660 517 698 400" stroke-width="7"/>
    <path d="M470 400 H698" stroke-width="3" stroke-opacity=".45"/>
    <path d="M470 283 h228" stroke-width="2.5" stroke-dasharray="7 12" stroke-opacity=".3"/>
    <path d="M470 517 h228" stroke-width="2.5" stroke-dasharray="7 12" stroke-opacity=".3"/>
  </g>
</svg>
